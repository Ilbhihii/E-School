name: smart_school_academy
description: Application mobile Smart School Academy — Apprentissage intelligent de l'Arabe et du Coran.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # State management
  provider: ^6.1.1

  # Storage local
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  lottie: ^3.1.0

  # Video
  youtube_player_flutter: ^9.0.3
  url_launcher: ^6.2.4

  # Audio recording (test vocal)
  record: ^5.1.2

  # Utilitaires
  intl: ^0.19.0
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
